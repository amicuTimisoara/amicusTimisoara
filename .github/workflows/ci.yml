name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore

      # Code warnings fail the build, but NuGet audit warnings (NU19xx) only warn.
      # A newly published advisory against a transitive package would otherwise
      # block every open PR overnight through no fault of the change.
      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror -warnnotaserror:NU1901,NU1902,NU1903,NU1904

      - name: Test
        run: dotnet test --no-build -c Release
