name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & test
    runs-on: ubuntu-latest

    # The integration tests run against a real Postgres on purpose: the rule that
    # one slot holds one live booking is a partial unique index, and no in-memory
    # provider enforces it. Testing without Postgres would pass while production
    # double-booked.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: amicus
          POSTGRES_PASSWORD: amicus_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amicus -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AMICUS_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=amicus;Password=amicus_dev

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore

      # Code warnings fail the build, but NuGet audit warnings (NU19xx) only warn.
      # A newly published advisory against a transitive package would otherwise
      # block every open PR overnight through no fault of the change.
      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror -warnnotaserror:NU1901,NU1902,NU1903,NU1904

      - name: Test
        run: dotnet test --no-build -c Release
